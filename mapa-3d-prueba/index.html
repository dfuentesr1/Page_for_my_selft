@media (hover:hover){.pad,.run{display:none}}

/* suelo pintado: isla con césped acuarela, camino de tierra y borde de acantilado */

/* borde de la isla pintado (tu dibujo): una cinta alrededor de la costa con hierba, tierra, raíces y piedras */
{const tex=new THREE.TextureLoader().load('borde.png');tex.colorSpace=THREE.SRGBColorSpace;tex.wrapS=THREE.RepeatWrapping;tex.anisotropy=8;

  for(let i=0;i<70;i++){const x=r()*W,y=r()*H,s=.6+r()*.8;g.strokeStyle='rgba(250,248,235,.75)';g.lineWidth=3;g.beginPath();g.moveTo(x-16*s,y);g.quadraticCurveTo(x-8*s,y-7*s,x,y);g.quadraticCurveTo(x+8*s,y-7*s,x+16*s,y);g.stroke()}});

/* espuma alrededor de la isla */

/* cargar modelos */
const LD=new GLTFLoader();

  const path=()=>{g.beginPath();g.moveTo(...P[0]);g.lineTo(...P[1]);g.quadraticCurveTo(.38*W,.52*H,...P[3]);g.moveTo(...P[1]);g.quadraticCurveTo(.62*W,.55*H,...P[5])};
  g.lineJoin=g.lineCap='round';path();g.lineWidth=70;g.strokeStyle='rgba(42,29,23,.7)';g.stroke();path();g.lineWidth=64;g.strokeStyle='#c4a771';g.stroke();path();g.lineWidth=52;g.strokeStyle='#e8d4a2';g.stroke();path();g.lineWidth=20;g.strokeStyle='rgba(255,250,230,.45)';g.stroke()});

/* altura del césped bajo cada punto (la isla no es del todo plana) */
const rcH=new THREE.Raycaster();const groundY=(x,z)=>{rcH.set(new THREE.Vector3(x,60,z),new THREE.Vector3(0,-1,0));const h=rcH.intersectObject(isla,true)[0];return h?h.point.y:null};

  const petal=[0xfff3d8,0xe6a0a6,0xd4574a,0xf6ecd2].map(c=>new THREE.MeshToonMaterial({color:c,gradientMap:grad}));const ctr=new THREE.MeshToonMaterial({color:0xe2bd62,gradientMap:grad});

/* post-proceso: sepia, papel, grano, viñeta y líneas que tiemblan como el resto del juego */
const comp=new EffectComposer(R);comp.addPass(new RenderPass(S,cam));
const look=new ShaderPass({uniforms:{tDiffuse:{value:null},t:{value:0},res:{value:new THREE.Vector2(innerWidth,innerHeight)}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`uniform sampler2D tDiffuse;uniform float t;uniform vec2 res;varying vec2 vUv;
 float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
 void main(){float fr=floor(t*12.);vec2 j=(vec2(h(vUv*40.+fr),h(vUv*40.+fr+3.))-.5)*1.2/res;
  vec3 c=texture2D(tDiffuse,vUv+j).rgb;
  c=mix(c,c*vec3(0.98,0.9,0.76)+vec3(0.04,0.03,0.0),.85);                         /* tinte sepia */
  float g=h(vUv*res+fr*7.);c+=(g-.5)*.07;             /* grano */
  float pp=h(floor(vUv*res/3.));c*=.97+.03*pp;        /* papel */
  float d=distance(vUv,vec2(.5));c*=1.-smoothstep(.5,.9,d)*.45;  /* viñeta */
  gl_FragColor=vec4(c,1.);}`});
comp.addPass(look);

/* control */
let runBtn=false;const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
const tv={x:0,y:0};const pad=document.getElementById('pad'),knob=pad.firstElementChild;
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);mv(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)mv(e)});
pad.addEventListener('pointerup',()=>{tv.x=tv.y=0;knob.style.transform=''});
function mv(e){const r=pad.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2),m=Math.max(1,Math.hypot(x,y));tv.x=x/m;tv.y=y/m;knob.style.transform=`translate(${tv.x*36}px,${tv.y*36}px)`}
const inIsland=(x,z)=>{if(Math.hypot(x,z)>16.5*IR)return false;const y=groundY(x,z);if(y===null||Math.abs(y)>1.4)return false;return true;let ins=false;const P=pts.map(p=>[p.x*.95,-p.y*.95]);for(let i=0,j=P.length-1;i<P.length;j=i++){const [xi,zi]=P[i],[xj,zj]=P[j];if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi))ins=!ins}return ins};
const blocked=(x,z)=>!inIsland(x,z)||solids.some(s=>Math.hypot(x-s.x,z-s.z)<s.r+.3);
let yaw=0;const clk=new THREE.Clock();const camPos=new THREE.Vector3();
document.getElementById('load').remove();{const rb=document.getElementById('run');rb.addEventListener('pointerdown',()=>runBtn=true);['pointerup','pointercancel','pointerleave'].forEach(e=>rb.addEventListener(e,()=>runBtn=false))}
window.__S={player,keys,cam};
R.setAnimationLoop(()=>{const dt=Math.min(.05,clk.getDelta()),T=clk.elapsedTime;
  let ix=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+tv.x,iz=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0)+tv.y;
  const m=Math.hypot(ix,iz),moving=m>.15;
  if(moving){ix/=Math.max(1,m);iz/=Math.max(1,m);const running=keys.ShiftLeft||keys.ShiftRight||runBtn,sp=(running?8.5:4)*dt,nx=player.position.x+ix*sp,nz=player.position.z+iz*sp;
    if(!blocked(nx,nz)){player.position.x=nx;player.position.z=nz}else if(!blocked(nx,player.position.z))player.position.x=nx;else if(!blocked(player.position.x,nz))player.position.z=nz;
    const ty=Math.atan2(ix,iz);let d=ty-yaw;d=Math.atan2(Math.sin(d),Math.cos(d));yaw+=d*(1-Math.exp(-dt*14));buf.rotation.y=yaw}
  const want=moving?((keys.ShiftLeft||keys.ShiftRight||runBtn)?acts.run:acts.walk):acts.idle;if(want!==cur){want.reset().play();cur.crossFadeTo(want,.25,true);cur=want}
  mixer.update(dt);
  sway.forEach((g,i)=>{g.rotation.z=Math.sin(T*2.2+i)*.12});player.position.y+=( (groundY(player.position.x,player.position.z)??0)-player.position.y)*.3;trees.forEach(g=>{g.rotation.z=Math.sin(T*1.4+g.userData.sway)*.025});
  waterTex.offset.set(Math.sin(T*.2)*.02,T*.004);
  camPos.copy(player.position).add(CAMOFF);cam.position.lerp(camPos,1-Math.exp(-dt*4));cam.lookAt(cam.position.clone().sub(CAMOFF));
  sun.position.copy(cam.position).sub(CAMOFF).add(new THREE.Vector3(-6,12,7));sun.target.position.copy(cam.position).sub(CAMOFF);
  look.uniforms.t.value=T;comp.render()});
addEventListener('resize',()=>{mkCam();R.setSize(innerWidth,innerHeight);comp.setSize(innerWidth,innerHeight);look.uniforms.res.value.set(innerWidth,innerHeight);comp.passes[0].camera=cam});
cam.position.copy(player.position).add(CAMOFF);cam.lookAt(player.position);
window.__ready=true;
</script></body></html>
